<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />

      property="og:title"
      content="Morgan Spencer | Software Engineering & Architecture"
    />

      property="og:description"
      content="Exploring software engineering, frontend architecture, and technical leadership through a career spanning development, design, and digital strategy."
    />

    <meta property="og:image" content="/social.webp" />

    <meta property="profile:last_name" content="Spencer" />
    <meta property="profile:username" content="morganspencerdev" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@morganspencerdev" />
    <meta
      name="twitter:title"
      content="Morgan Spencer | Software Engineering & Architecture"
    />
    <meta
      name="twitter:description"
      content="Software engineering, frontend architecture, and technical leadership. Explore my experience, education, and tech stack."
    />
    <meta name="twitter:image" content="/social.webp" />
    <link rel="stylesheet" href="/src/styles/site.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://spencer.dev/#person",
        "name": "Morgan Spencer",
        "givenName": "Morgan",
        "familyName": "Spencer",
        "additionalName": "Matthew",
        "honorificSuffix": "MBA",
        "jobTitle": "Lead Software Engineer",
        "url": "https://spencer.dev",
        "description": "Software engineer with experience in frontend architecture, reusable component systems, web development, and digital strategy.",
        "homeLocation": {
          "@type": "Place",
          "name": "Charleston, South Carolina"
        },
        "alumniOf": [
          {
            "@type": "EducationalOrganization",
            "name": "Philadelphia University",
            "sameAs": "https://www.jefferson.edu"
          },
          {
            "@type": "EducationalOrganization",
            "name": "The Citadel",
            "sameAs": "https://citadel.edu"
          }
        ],
        "knowsAbout": [
          "Software Engineering",
          "Frontend Architecture",
          "React",
          "TypeScript",
          "JavaScript",
          "Web Components",
          "Component-Based Architecture",
          "Web Accessibility",
          "HTML",
          "CSS",
          "Node.js",
          "Web Development"
        ],
        "knowsLanguage": ["English"],
        "sameAs": [
          "https://github.com/morganspencerdev",
          "https://www.linkedin.com/in/morganspencerdev"
        ]
      }
    </script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header>
      <a href="/">spencer.dev</a>

      <label class="checkbox-switch">
        <load src="/src/icons/moon.html" />

        <input
          id="dark-mode"
          type="checkbox"
          role="switch"
          aria-label="Dark mode"
          class="sr-only"
        />

        <load src="/src/icons/sun.html" />
      </label>

      <details>
        <summary>
          <span class="sr-only">Toggle layout options</span>
          <load src="/src/icons/layout.html" />
        </summary>

        <fieldset id="layout-options">
          <legend class="sr-only">Layout options</legend>

          <label>
            <input
              type="radio"
              name="layout"
              value="editorial"
              class="sr-only"
            />
            <load src="/src/icons/newspaper.html" />
            Editorial
          </label>

          <label>
            <input type="radio" name="layout" value="classic" class="sr-only" />
            <load src="/src/icons/file-text.html" />
            Classic
          </label>

          <label>
            <input
              type="radio"
              name="layout"
              value="terminal"
              class="sr-only"
            />
            <load src="/src/icons/terminal-window.html" />
            Terminal
          </label>

          <label>
            <input type="radio" name="layout" value="desktop" class="sr-only" />
            <load src="/src/icons/desktop.html" />
            Desktop
          </label>

          <label>
            <input type="radio" name="layout" value="ide" class="sr-only" />
            <load src="/src/icons/file-code.html" />
            IDE
          </label>
        </fieldset>
      </details>
    </header>

    <main id="main">
      <noscript>
        <load src="/src/layouts/editorial" />
      </noscript>
    </main>

    <footer>
      <p>
        &copy;
        <script>
          document.currentScript.replaceWith(new Date().getFullYear())
        </script>
        Morgan Spencer
      </p>

      <nav aria-label="Social">
        <a
          href="https://www.linkedin.com/in/morganspencerdev"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
        >
          <load src="/src/icons/linkedin.html" />
        </a>

        <a
          href="https://github.com/morganspencerdev"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
        >
          <load src="/src/icons/github.html" />
        </a>
      </nav>
    </footer>

    <template data-layout="editorial">
      <load src="/src/layouts/editorial" />
    </template>

    <template data-layout="classic">
      <load src="/src/layouts/classic" />
    </template>

    <template data-layout="terminal">
      <load src="/src/layouts/terminal" />
    </template>

    <template data-layout="desktop">
      <load src="/src/layouts/desktop" />
    </template>

    <template data-layout="ide">
      <load src="/src/layouts/ide" />
    </template>

    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
